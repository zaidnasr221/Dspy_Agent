[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "facade-dspy"
version = "0.1.0"
description = "Evidence-backed PDF extraction with DSPy and Claude Code or OpenCode/OpenAI vision tools"
requires-python = ">=3.11"
dependencies = ["dspy==3.5.0", "pydantic>=2.11,<3", "polars>=1,<3", "pymupdf>=1.26,<2", "python-dotenv>=1.2,<2", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime==1.4.4"]
observability = ["mlflow==3.18.0"]
test = ["pytest>=8,<10", "pyinstrument>=5.1,<6"]
profile = ["pyinstrument>=5.1,<6"]

[project.scripts]
facade-extract = "facade_dspy.cli:main"

[tool.setuptools.packages.find]
include = ["facade_dspy*"]

[tool.setuptools.package-data]
facade_dspy = ["knowledge/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
