[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "facade-dspy"
version = "0.1.0"
description = "Evidence-backed PDF extraction with DSPy and a Claude Code vision tool"
requires-python = ">=3.11"
dependencies = ["dspy==3.4.1", "pydantic>=2.11,<3", "polars>=1,<3", "pymupdf>=1.26,<2", "python-dotenv>=1.2,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
facade-extract = "facade_dspy.cli:main"

[tool.setuptools.packages.find]
include = ["facade_dspy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
